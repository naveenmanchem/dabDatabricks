resources:
  jobs:
    sample_workflow_job:
      name: "[${bundle.target}] Sample Data Pipeline Job"
      
      # Define the shared compute configuration for this job
      compute:
        - compute_key: serverless_compute
          spec:
            # Setting this to true tells Databricks to use Serverless Compute
            is_serverless: true

      tasks:
        - task_key: run_notebook_task
          # Reference the serverless compute defined above
          compute_key: serverless_compute
          notebook_task:
            notebook_path: ../src/mynotebook.ipynb
