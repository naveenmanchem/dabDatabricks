bundle:
  name: dabDatabricks

# Include resource configuration files from the resources directory
include:
  - resources/*.yml
# Define target deployment environments
targets:
  dev:
    default: true
    workspace:
      #host: https://sandbox-cti-citi-sk-tf-test.cloud.databricks.com
      host: {{ github.ref == 'refs/heads/main' && 'secrets.DEV_DATABRICKS_HOST' }}
      root_path: /Workspace/Users/.bundle/${bundle.name}/dev
