name: "Databricks CI/CD"
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: read
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ github.ref == 'refs/heads/main' && 'secrets.DEV_DATABRICKS_HOST' }}
      #DATABRICKS_TOKEN: ${{ github.ref == 'refs/heads/main' && 'secrets.DEV_DATABRICKS_TOKEN' }}
      DATABRICKS_CLIENT_ID: ${{ github.ref == 'refs/heads/main' && 'secrets.DEV_DATABRICKS_CLIENT_ID' }}

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Databricks CLI (includes built-in DAB commands)
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # Step 3: Create federation policy
      - name: Setup federation policy on CLI
        run: |
          databricks account service-principal-federation-policy create b360c922-5966-487e-a26b-8ec2fb4db3b6 --json '{
            "oidc_policy": {
	                "issuer": "https://token.actions.githubusercontent.com",
	          "audiences": [
  	          "a92639c7-0cd9-4877-b1f8-291ffe3056a4"
	          ],
	          "subject": "repo:naveenmanchem/dabDatabricks:environment:dev"
           }
          }'

      # Step 3: Run structural and configuration check
      - name: Validate Asset Bundle
        run: |
          databricks bundle validate

      # Step 4: Deploy the bundle on pushes (Merges/Commits) to main branche
      - name: Deploy Asset Bundle
        if: github.event_name == 'push'
        run: |
          databricks bundle deploy --target dev
