name: "Databricks CI/CD"
run-name: DAB Deployment POC
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://sandbox-cti-citi-sk-tf-test.cloud.databricks.com/
      #DATABRICKS_TOKEN: ${{ github.ref == 'refs/heads/main' && 'secrets.DEV_DATABRICKS_TOKEN' }}
      DATABRICKS_CLIENT_ID: b360c922-5966-487e-a26b-8ec2fb4db3b6

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Databricks CLI (includes built-in DAB commands)
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # Step 3: Run structural and configuration check
      - name: Validate Asset Bundle
        run: |
          databricks bundle validate

      # Step 4: Deploy the bundle on pushes (Merges/Commits) to main branche
      #- name: Deploy Asset Bundle
      #  if: github.event_name == 'push'
      #  run: |
      #    databricks bundle deploy --target dev
